<script>const LOGO="images/budapestflow-logo.webp",REVIEW_URL="https://www.tripadvisor.com/Attraction_Review-g274887-d8358217-Reviews-BudapestFlow-Budapest_Central_Hungary.html",TOURS_URL="https://budapestflow.com",GOOGLE_REVIEW_URL="#",TIP_LINKS=[{label:"\u20AC10",url:"#"},{label:"\u20AC20",url:"#",featured:!0},{label:"\u20AC30",url:"#"},{label:"Other",url:"#",cta:"Choose your amount"}],tipGo=e=>`<a class="btn btn-primary" id="tip-go" href="${esc(e.url)}"${e.url==="#"?"":' target="_blank" rel="noopener"'}>${ico("heart")}${esc(e.cta||"Leave a "+e.label+" tip")}</a>`,CARD_URL="https://attila.budapestflow.com",EMAIL="info@budapestflow.com",TILE_LABELS="center",CARD_LAYOUT="compact",GROUP_IMG={"Hungarian kitchen":"images/cat-food.webp","Street food":"images/cat-quick.webp","Cakes & sweets":"images/cat-sweets.webp",Vegetarian:"images/cat-food.webp"},SHOW_HEADER=!1,SHOW_TABBAR=!0,TABS=[{id:"",href:"#",label:"Home",icon:"home"},{id:"food",href:"#cat/food",label:"Food",icon:"food"},{id:"coffee",href:"#cat/coffee",label:"Coffee",icon:"coffee"},{id:"saved",href:"#saved",label:"Saved",icon:"heart"},{id:"more",label:"More",icon:"grid"}],INSTAGRAM_URL="https://instagram.com/budapestflow",TOURS={"street-art":"Street Art Tour","mini-statues":"Hidden Mini Statues Tour",highlights:"Highlights and Hidden Gems"},CATEGORIES=[{id:"food",c1:"#B5654A",c2:"#7A3B2A",img:"images/cat-food.webp",label:"Food",home:!0,intro:"Proper Hungarian meals, street food for a quick bite, cakes for after, and good vegetarian places."},{id:"coffee",c1:"#8C6A52",c2:"#4E3829",img:"images/cat-coffee-central.webp",label:"Coffee",home:!0,intro:"Grand old caf\xE9s for the atmosphere, specialty spots for the coffee."},{id:"baths",c1:"#5F9A96",c2:"#2F6263",img:"images/cat-baths.webp",label:"Thermal baths",home:!0,intro:"Each bath has its own character. Pick the one that fits your mood."},{id:"danube",c1:"#5B7FA6",c2:"#2C4A6E",img:"images/cat-danube.webp",label:"Danube Cruise",home:!0,intro:"See the city from the river, the classic way or the local way."},{id:"drinks",c1:"#8A5A7A",c2:"#4E2F48",img:"images/cat-drinks.webp",label:"Drinks & nightlife",home:!0,intro:"Ruin bars, wine, craft beer and a rooftop."},{id:"rainy",c1:"#7D8794",c2:"#454E5C",img:"images/cat-rainy.webp",label:"Museums & indoors",home:!0,intro:"For a rainy afternoon, or when your feet need a break from walking."},{id:"offbeat",c1:"#9A6B4F",c2:"#5A3B2C",img:"images/cat-offbeat.webp",label:"Off the beaten path",home:!0,intro:"The Budapest most visitors miss: hidden courtyards, odd little museums and places where locals hang out."},{id:"practical",c1:"#8C9460",c2:"#555C38",img:"images/cat-practical.webp",label:"Practical tips",home:!0,intro:"Small things that save you money and hassle."}],PLACES=[{cat:"food",group:"Hungarian kitchen",name:"Menza",img:"images/places/menza.webp",why:"Stylish, vintage-inspired classic in the city centre, serving both Hungarian and international dishes. I like it best for a weekday lunch.",price:2,near:"Liszt Ferenc Square, near Oktogon",good:["Lunch","Dinner"],tip:"Good-value weekday lunch menu. Terrace in summer.",order:"Garlic cream soup, goulash",web:"https://menzaetterem.hu/en/",placeId:"ChIJ1dRim27cQUcR_kCX7BuqHTY"},{cat:"food",group:"Hungarian kitchen",name:"Caf\xE9 K\xF6r",img:"images/places/cafe-kor.webp",why:"Where I send guests near the Basilica for solid Hungarian food, no fuss.",price:2,near:"Near St. Stephen's Basilica",good:["Lunch","Dinner"],tip:"Daily specials on the board.",order:"Goulash",tours:["highlights"]},{cat:"food",group:"Hungarian kitchen",name:"K\u0151leves Vend\xE9gl\u0151",img:"images/places/koleves.webp",why:"Jewish-Hungarian comfort food in a former kosher butcher's shop. Come hungry.",price:2,near:"Kazinczy utca, Jewish Quarter",good:["Lunch","Dinner","Veggie"],tip:"Weekday lunch deal with soup and dessert. Not kosher.",order:"Matzo ball soup, s\xF3let (cholent)",fav:!0,web:"https://kolevesvendeglo.hu/en/",placeId:"ChIJOygAumncQUcRj5mDcDKq45I"},{cat:"food",group:"Hungarian kitchen",name:"Gett\xF3 Guly\xE1s",img:"images/places/getto-gulyas.webp",why:"My stew stop: more than ten kinds of p\xF6rk\xF6lt to choose from.",price:2,near:"Near the Great Synagogue",good:["Lunch","Dinner"],tip:"Almost always full. Book ahead, even for lunch.",order:"P\xF6rk\xF6lt with nokedli, soml\xF3i for dessert",fav:!0,web:"https://gettogulyas.hu/en/homepage/",placeId:"ChIJZb83JGjcQUcR1M0xNU7rtsI"},{cat:"food",group:"Hungarian kitchen",name:"Rosenstein",img:"images/places/rosenstein.webp",why:"A family-run Jewish restaurant and a local favourite for decades. I'd save it for a proper dinner.",price:3,near:"Near Keleti railway station",good:["Dinner"],tip:"Worth the short trip out.",order:"Ask the owner"},{cat:"food",group:"Hungarian kitchen",name:"TATI From Farm to Table",img:"images/places/tati.webp",why:"Modern Hungarian cooking with produce from their own farm. I'd choose it for a special night.",price:4,near:"Doh\xE1ny utca, Jewish Quarter",good:["Dinner","Date night"],tip:"Book ahead. There is a vegan tasting menu too.",order:"The seasonal tasting menu",web:"https://tatibudapest.com/",placeId:"ChIJsdS42GjdQUcR7ovm-5DHmWo"},{cat:"food",group:"Street food",name:"Retro L\xE1ngos",img:"images/places/retro-langos.webp",why:"My go-to for l\xE1ngos, and it has been going since 2011.",price:1,near:"Bajcsy-Zsilinszky \xFAt, near Arany J\xE1nos metro",good:["Quick bite","Budget","Veggie"],tip:"Gluten-free and vegan versions too. Second shop near the Parliament, in V\xE9csey utca.",order:"Classic l\xE1ngos with sour cream and cheese",web:"https://retrolangos.hu/en/",placeId:"ChIJIZUXVGvcQUcRmGhtnafDysU"},{cat:"food",group:"Street food",name:"Bors GasztroB\xE1r",img:"images/places/bors.webp",why:"Creative soups and baguettes in a tiny place. One of my favourites for a quick lunch.",price:1,near:"Jewish Quarter",good:["Quick bite","Budget"],tip:"Expect a queue, it moves fast.",order:"Soup of the day",fav:!0,tours:["street-art","mini-statues"]},{cat:"food",group:"Cakes & sweets",name:"Szamos",img:"images/places/szamos.webp",why:"I always stop here for marzipan and a classic cake, and it makes a lovely gift.",price:2,near:"Several shops in the centre",good:["Sweet tooth","Gifts"],fav:!0},{cat:"food",group:"Cakes & sweets",name:"Auguszt",img:"images/places/auguszt.webp",why:"A family patisserie since the 19th century. Go for the old-fashioned cakes.",price:2,near:"Several shops in the centre",good:["Sweet tooth"]},{cat:"food",group:"Vegetarian",name:"Napf\xE9nyes",img:"images/places/napfenyes.webp",why:"One of the city's longest-running vegan kitchens, with plant-based versions of Hungarian classics. A safe bet for vegetarian guests.",price:2,near:"Ferenciek tere, near Elizabeth Bridge",good:["Lunch","Dinner","Veggie"],tip:"Open every day. Leave room for a vegan cake.",order:"Vegan goulash or stuffed cabbage",web:"https://napfenyesetterem.hu/"},{cat:"food",group:"Vegetarian",name:"Tahina Bite",img:"images/places/tahina-bite.webp",why:"Vegan Middle Eastern food: crisp falafel, hummus and baba ghanoush. Quick and cheap in the Jewish Quarter.",price:1,near:"Wessel\xE9nyi utca, Jewish Quarter",good:["Quick bite","Budget","Veggie"],tip:"Open every day, 11 am to 10 pm.",order:"Falafel plate with hummus",web:"https://tahinabite.com/"},{cat:"coffee",group:"Historic grand caf\xE9s",name:"Central Caf\xE9",img:"images/places/central-cafe.webp",why:"A classic literary caf\xE9, calmer than the New York. I'd come for a slow breakfast.",price:3,near:"Near Elizabeth Bridge",good:["Breakfast","Cake break"],order:"Cake and coffee",web:"https://centralgrandcafe.hu/en/home/",placeId:"ChIJPWTeZUTcQUcRMXCSK_9QR0E"},{cat:"coffee",group:"Historic grand caf\xE9s",name:"P\xE1risi Passage",img:"images/places/parisi-passage.webp",why:"Coffee and cake under the stained-glass dome of the P\xE1risi Udvar. A beautiful place to rest your feet.",price:3,near:"Ferenciek tere, near Elizabeth Bridge",good:["Cake break","Sightseeing"],tip:"Caf\xE9 by day, restaurant in the evening. Book for dinner.",order:"Coffee and a French-style dessert",web:"https://parisipassage.hu/",placeId:"ChIJwxcVFcTdQUcRbgQjKuCiuiI"},{cat:"coffee",group:"Historic grand caf\xE9s",name:"M\u0171v\xE9sz",img:"images/places/muvesz.webp",why:"An old caf\xE9 opposite the Opera. I'd stop here before or after a show.",price:2,near:"Opposite the Opera House",good:["Cake break"]},{cat:"coffee",group:"Specialty coffee",name:"Massolit Books & Caf\xE9",img:"images/places/massolit.webp",why:"English-language bookshop and caf\xE9 with a hidden back garden. My favourite quiet corner.",price:2,near:"Nagy Di\xF3fa utca, Jewish Quarter",good:["Coffee lovers","Quiet"],tip:"Take a table in the garden in summer. Busy with students at peak hours.",order:"Homemade cake and a coffee",fav:!0,placeId:"ChIJb-V2Q2jcQUcRLRX9PFUgj7w"},{cat:"coffee",group:"Specialty coffee",name:"Espresso Embassy",img:"images/places/espresso-embassy.webp",why:"Serious coffee near the Basilica, for when I want a proper espresso.",price:2,near:"Near St. Stephen's Basilica",good:["Coffee lovers"],tours:["mini-statues"],web:"https://espressoembassy.hu/",placeId:"ChIJGyzE_xTcQUcRlvjbtChDLtU"},{cat:"coffee",group:"Specialty coffee",name:"My Little Melbourne",img:"images/places/my-little-melbourne.webp",why:"A small specialty bar in the Jewish Quarter, good for a quick coffee.",price:2,near:"Jewish Quarter",good:["Coffee lovers"],tours:["street-art"]},{cat:"coffee",group:"Specialty coffee",name:"Fekete",img:"images/places/fekete.webp",why:"A hidden courtyard caf\xE9 and one of the city's specialty pioneers. Half the fun is finding it.",price:2,near:"Near the National Museum",good:["Breakfast","Coffee lovers"],tip:"Enter through the courtyard. Brunch is served until early afternoon.",web:"https://feketekv.hu/",placeId:"ChIJ-UU5E0PcQUcRP0iqvvmBTO8"},{cat:"offbeat",name:"Paloma Artspace",img:"images/places/paloma.webp",why:"Local designers' workshops around a hidden colonnaded courtyard. My first stop for a gift.",price:0,near:"Kossuth Lajos utca, near Astoria",good:["Shopping","Souvenirs"],tip:"The best place for handmade gifts. Peek into the Unger House courtyard nearby too.",web:"https://www.palomaartspace.com/",placeId:"ChIJe9fZIvfdQUcREuq3JWU730E"},{cat:"offbeat",name:"Koller Gallery",img:"images/places/koller.webp",why:"A secret gallery in the Castle District with a garden over the Danube. Most visitors walk right past it.",price:0,near:"T\xE1ncsics Mih\xE1ly utca, Castle District",good:["Art","Quiet"],tip:"Free to look around. All the pieces are for sale.",web:"https://www.kollergaleria.hu/",placeId:"ChIJBzFbyhjcQUcRhPRIyE8cQt8"},{cat:"offbeat",name:"Pinball Museum",img:"images/places/pinball.webp",why:"Europe's biggest pinball collection, and you can play almost all of it. Great on a rainy evening.",price:2,near:"Radn\xF3ti Mikl\xF3s utca, District XIII",good:["Rainy day","Evening"],tip:"One ticket, unlimited games. Open from the afternoon, closed Mon\u2013Tue.",web:"https://flippermuzeum.hu/en/",placeId:"ChIJRRMeY47cQUcRjgnfTfZA7s4"},{cat:"offbeat",name:"Children's Railway",img:"images/places/childrens-railway.webp",why:"A forest railway in the Buda Hills, run by kids aged 10 to 14. A real change of pace.",price:1,near:"Buda Hills, Sz\xE9chenyi-hegy",good:["Families","Nature"],tip:"Bring cash for tickets. Closed on Mondays.",web:"https://gyermekvasut.hu/en/",placeId:"ChIJ11SpDg_fQUcR8H-Af2VJzic"},{cat:"offbeat",name:"Memento Park",img:"images/places/memento-park.webp",why:"Where Budapest's old communist statues ended up, all in one open-air park.",price:2,near:"Outskirts of Buda, District XXII",good:["History"],tip:"It's a trip out of the centre. Their short guided tour makes all the difference.",web:"https://www.mementopark.hu/",placeId:"ChIJu0bfv2znQUcRzGPO9XqR-bc"},{cat:"offbeat",name:"Nyolc\xE9sf\xE9l",img:"images/places/nyolcesfel.webp",why:"Artists' studios and a ruin bar in an old telephone exchange, where locals hang out.",price:1,near:"N\xE9met utca, District VIII",good:["Evening","Art"],tip:"A local artists' hangout with a cheap, laid-back bar.",web:"https://nyolcesfel.hu/",placeId:"ChIJqYGX84HdQUcRkCVzggfelto"},{cat:"baths",name:"Sz\xE9chenyi",img:"images/places/szechenyi.webp",why:"The big yellow classic, and where I'd take a first-timer. Go early.",price:3,near:"City Park",good:["First-timers","Groups"],best:"Early morning",tip:"Bring flip-flops and a towel.",fav:!0},{cat:"baths",name:"Rudas",img:"images/places/rudas.webp",why:"Ottoman dome and a rooftop pool with a view. I'd go in the evening.",price:3,near:"Foot of Gell\xE9rt Hill, Buda",good:["Views"],best:"Evening",tip:"Check men-only and women-only days."},{cat:"baths",name:"Luk\xE1cs",img:"images/places/lukacs.webp",why:"Where the locals go. Less show, more actual bathing.",price:2,near:"Buda end of Margaret Bridge",good:["Quiet time"],best:"Weekday morning"},{cat:"baths",name:"Veli Bej",img:"images/places/veli-bej.webp",why:"A small, quiet Ottoman bath, and a hidden favourite of mine.",price:2,near:"Buda end of Margaret Bridge",tip:"Limited capacity.",good:["Quiet time","Couples"],best:"Weekday afternoon"},{cat:"danube",name:"Evening river cruise",img:"images/places/river-cruise.webp",why:"The Parliament lit up from the water. I'd do this once, at sunset.",price:3,near:"Pest riverbank",good:["Couples","Photos"],best:"Sunset",tip:"Sunset departures sell out.",fav:!0},{cat:"danube",name:"Public boat D11 / D12",img:"images/places/public-boat.webp",why:"My local hack: similar views for a fraction of the price.",price:1,near:"Stops along both riverbanks",good:["Budget","Photos"],best:"Late afternoon",tip:"Check the timetable, it changes by season."},{cat:"drinks",name:"Szimpla Kert",img:"images/places/szimpla.webp",why:"The original ruin bar. I'd see it once, ideally before it gets busy.",price:1,near:"Jewish Quarter",good:["First-timers","Groups"],best:"Evening",tip:"Sunday morning farmers' market.",tours:["street-art"]},{cat:"drinks",name:"Csendes L\xE9tterem",img:"images/places/csendes.webp",why:"A surreal junk-art bar in an 1883 caf\xE9 building. Look up and around.",price:2,near:"Ferenczy Istv\xE1n utca, near Astoria",good:["Groups","Cocktails"],best:"Evening",tip:"Look for the old Caf\xE9 Fiume lettering on the window. Opens late afternoon.",placeId:"ChIJtfzFXUPcQUcR3mCDIuuQb1g"},{cat:"drinks",name:"Tasting Table",img:"images/places/tasting-table.webp",why:"My kind of tasting spot: cosy, in a lovely local neighbourhood. The owners are real wine enthusiasts, and their tastings are excellent.",price:2,near:"Br\xF3dy S\xE1ndor utca, District VIII",good:["Wine lovers","Tastings"],tip:"Book the sommelier-led tasting ahead, or drop into their wine shop across the street for a glass or a flight.",order:"A tasting flight of Hungarian wines",fav:!0,web:"https://tastehungary.com/tasting-table-budapest/",cta:"Book a tasting",placeId:"ChIJ_TYfaz3cQUcRxuWm7zf5llE"},{cat:"drinks",name:"Doblo",img:"images/places/doblo.webp",why:"A cosy wine bar in the Jewish Quarter, perfect after a walk through the district.",price:2,near:"Jewish Quarter",good:["Wine lovers","Couples"],best:"Evening"},{cat:"drinks",name:"Kadarka Wine Bar",img:"images/places/kadarka.webp",why:"Around a hundred Hungarian wines open by the glass. Where I'd go to find out what kadarka is.",price:2,near:"Kir\xE1ly utca, Jewish Quarter",good:["Wine lovers","Couples"],best:"Evening",tip:"Book after 7 pm. Ask for small tasting pours before you pick a glass.",order:"A glass of Szeksz\xE1rd kadarka",placeId:"ChIJkaD3aGncQUcRoEcntPpnrW8"},{cat:"drinks",name:"\xC9leszt\u0151",img:"images/places/eleszto.webp",why:"Craft beer in a former glassworks. My pick for a beer-lover's evening.",price:1,near:"Near Corvin Quarter",good:["Beer lovers","Groups"],best:"Evening"},{cat:"drinks",name:"Fekete Kutya",img:"images/places/fekete-kutya.webp",why:"Tiny, shabby, honest: a local bar with good-value beer.",price:1,near:"Dob utca, Jewish Quarter",good:["Beer lovers","Late night"],best:"Late evening",tip:"Opens at 5 pm, closed on Sundays. Gets packed when there's a DJ.",placeId:"ChIJJ0WFtGncQUcRI3vuFybLNmA"},{cat:"drinks",name:"360 Bar",img:"images/places/360-bar.webp",why:"A rooftop on Andr\xE1ssy \xFAt. Go at sunset, if the weather plays along.",price:3,near:"On Andr\xE1ssy Avenue",good:["Couples"],best:"Sunset",tip:"Weather dependent."},{cat:"rainy",group:"Museums & sights",name:"Museum of Fine Arts",img:"images/places/fine-arts.webp",why:"Europe's old masters, plus Egyptian and classical art. I'd give it a full morning.",price:2,near:"Heroes' Square",good:["Art","Rainy day"],tip:"Closed Mondays. Combine it with the M\u0171csarnok across the square.",web:"https://www.szepmuveszeti.hu/en/",placeId:"ChIJ-6FvO4jbQUcROeO39pe3Sxs"},{cat:"rainy",group:"Museums & sights",name:"M\u0171csarnok",img:"images/places/mucsarnok.webp",why:"Big contemporary shows in a grand hall on Heroes' Square. I check what's on before I go.",price:2,near:"Heroes' Square",good:["Art"],tip:"Each exhibition has its own ticket. Closed Mondays.",web:"https://mucsarnok.hu/",placeId:"ChIJd4t1FHjcQUcR6I49YlZiUg4"},{cat:"rainy",group:"Museums & sights",name:"Ludwig Museum",img:"images/places/ludwig.webp",why:"Modern and contemporary art, from Picasso to Central European artists. Open late, which helps.",price:2,near:"M\xFCpa, on the Danube bank in District IX",good:["Art","Rainy day"],tip:"Open until 8 pm, closed Mondays.",web:"https://www.ludwigmuseum.hu/en",placeId:"ChIJ5_bsZQTdQUcRd39JyGJUeRE"},{cat:"rainy",group:"Museums & sights",name:"Hospital in the Rock",img:"images/places/hospital-rock.webp",why:"A wartime hospital inside Castle Hill. It stays with you.",price:2,near:"Castle District",tip:"Guided visits only.",good:["History"]},{cat:"rainy",group:"Museums & sights",name:"House of Music Hungary",img:"images/places/house-of-music.webp",why:"An interactive music museum in City Park. Great with kids, and fun without them.",price:2,near:"City Park",good:["Families"],fav:!0},{cat:"rainy",group:"Small galleries",name:"Inda Gallery",img:"images/places/inda.webp",why:"Contemporary Hungarian and international art, chosen by in-house art historians. I drop in whenever I'm nearby.",price:0,near:"Kir\xE1ly utca, District VI",good:["Art","Free"],tip:"Free to visit. Open Tuesday to Friday afternoons.",web:"https://www.indagaleria.hu/",placeId:"ChIJ69lVf2ncQUcRR6CQ6P8GXCI"},{cat:"rainy",group:"Small galleries",name:"De\xE1k Erika Gallery",img:"images/places/deak-erika.webp",why:"One of the city's longest-running galleries, open since 1998. A quiet way to see what Hungarian artists are up to.",price:0,near:"Mozs\xE1r utca, near the Opera",good:["Art","Free"],tip:"Free to visit. Open Wednesday to Friday, midday to 6 pm.",web:"https://deakerikagaleria.hu/",placeId:"ChIJE-dtQ2zcQUcRNx8-dc5Mgr8"},{cat:"rainy",group:"Small galleries",name:"Hungarian House of Photography",img:"images/places/mai-mano.webp",why:"Photo exhibitions in a historic photographer's studio house. I'd go for the building as much as the pictures.",price:1,near:"Nagymez\u0151 utca, near the Opera",good:["Art","Photography"],tip:"Small space, about half an hour. Closed Mondays.",web:"https://maimano.hu/",placeId:"ChIJgU5vE2zcQUcRXDGgKYfaaj8"}],TIPS=[{group:"Getting around",title:"Taxi",text:"Order through the Bolt, Uber or F\u0151taxi app. Licensed taxis and app rides run on set prices: the tariff is regulated, and the app shows you the price before you get in. If it says 'Freelancer' on the taxi, don't get in: it's a scam. Don't take a taxi that waves you over, and don't hail one on the street."},{group:"Getting around",title:"Public transport",text:"Buy a 24h or 72h pass if you'll ride more than a few times. The official BudapestGO app plans your route with live departures, and sells tickets and passes in English."},{group:"Getting around",title:"Airport bus 100E",text:"The cheap way to the airport: a direct bus from De\xE1k Ferenc t\xE9r (also stops at K\xE1lvin t\xE9r). It needs its own 2,500 HUF airport ticket. Just tap your bank card on the reader as you board. With a Budapest travel pass, buy the 1,000 HUF add-on in the BudapestGO app."},{group:"Money & safety",title:"Emergency: 112",text:"For police, an ambulance or the fire brigade, call 112. It's free from any phone.",action:{label:"Call 112",href:"tel:112"}},{group:"Money & safety",title:"Tipping",text:"Around 10\u201315% in restaurants. Check the bill: service is sometimes included."},{group:"Money & safety",title:"Pharmacy",text:"Look for the green cross and the word 'Gy\xF3gyszert\xE1r'."},{group:"Good to know",title:"Closing days",text:"Many museums close on Mondays, and some restaurants and small shops close on Sundays or Mondays. Check the opening hours before you set off."},{group:"Good to know",title:"Thermal bath basics",text:"Bring swimwear, flip-flops and your own towel, because many baths don't rent them or charge a lot. A swim cap is only needed in the lap pools. Rudas has men-only and women-only times in its Turkish bath, so check the schedule."},{group:"Good to know",title:"Phone and data",text:"EU SIM cards roam as at home. From outside the EU, an eSIM or a local prepaid SIM is usually cheaper than your home roaming."},{group:"Good to know",title:"Tap water",text:"It's safe to drink, so a refillable bottle saves you money."},{group:"Things to avoid",avoid:!0,title:"Riding without validating",text:"Stamp your paper ticket in the machine as you board, or at the metro entrance. An unvalidated ticket counts as no ticket, and inspectors fine on the spot."},{group:"Things to avoid",avoid:!0,title:"Euronet ATMs",text:"Use ATMs inside bank branches instead."},{group:"Things to avoid",avoid:!0,title:"Tourist exchange booths",text:"Pay by card, or withdraw forints from a bank ATM."},{group:"Things to avoid",avoid:!0,title:"Eating on V\xE1ci utca",text:"V\xE1ci utca (VAH-tsee OOT-tsah) is the long pedestrian shopping street in the centre of Pest, from V\xF6r\xF6smarty t\xE9r down to the Central Market Hall. Its restaurants are aimed at tourists: higher prices and average food. Walk a street or two away for better food at better prices."}],app=document.getElementById("app"),params=new URLSearchParams(location.search),tourKey=TOURS[params.get("tour")]?params.get("tour"):null,GROUP_FILTERS={food:{"Hungarian kitchen":"Hungarian","Street food":"Street food","Cakes & sweets":"Sweets",Vegetarian:"Veggie"}},filters={fav:!1,tag:null,group:null};let tagCat=null;const SAVE_KEY="bpf-tips-saved",placeKey=e=>e.cat+"|"+e.name;let saved=new Set;try{saved=new Set(JSON.parse(localStorage.getItem(SAVE_KEY)||"[]"))}catch{}const persistSaved=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify([...saved]))}catch{}},savedCount=()=>PLACES.filter(e=>saved.has(placeKey(e))).length,hashKey=e=>{let a=2166136261;for(let t=0;t<e.length;t++)a^=e.charCodeAt(t),a=Math.imul(a,16777619);return(a>>>0).toString(36)},listUrl=e=>{const a=new URL(location.href);return a.searchParams.delete("tour"),a.hash="saved="+e.map(t=>hashKey(placeKey(t))).join(","),a.href};let currentTab="";const esc=e=>String(e).replace(/[&<>"]/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[a]),ico=(e,a="icon")=>`<svg class="${a}" aria-hidden="true"><use href="#i-${e}"/></svg>`,priceHtml=e=>`<span role="img" aria-label="Price level ${e} of 4">${"\u20AC".repeat(e)}<b aria-hidden="true">${"\u20AC".repeat(4-e)}</b></span>`,mapsUrl=e=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.name+" Budapest")+(e.placeId?"&query_place_id="+encodeURIComponent(e.placeId):""),tileStyle=e=>e.img?`--img:url(${e.img})`:`--c1:${e.c1};--c2:${e.c2}`,catById=e=>CATEGORIES.find(a=>a.id===e);function reviewBlock(){return`<section class="review" aria-labelledby="review-title">
    <h2 id="review-title">Enjoyed the walk?</h2>
